<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCD Pot Plant Playground</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="playground.css"></head>
<body><main class="layout">
<section class="ranking" aria-labelledby="rankingTitle"><h1 id="rankingTitle"></h1><div id="instructions"><p data-text="imagine"></p><p data-text="questions"></p><p data-text="arrange"></p><p class="muted" data-text="starting"></p></div><p class="endpoint" data-text="strongest"></p><ol id="cards" aria-labelledby="rankingTitle"></ol><p class="endpoint" data-text="weakest"></p><button id="reset" class="text-button" data-text="reset"></button><button id="return" class="text-button" hidden data-text="return"></button></section>
<section class="plant" aria-label="Pot plant"><svg id="viz" viewBox="-60 -60 1000 1000" role="group" aria-labelledby="plantTitle"><title id="plantTitle"></title><defs><filter id="spiralGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="tipGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path id="spiralUnder" fill="none" stroke="var(--spiral)" stroke-opacity=".16" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><path id="spiral" fill="none" stroke="var(--spiral)" stroke-opacity=".86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#spiralGlow)"></path><circle id="oldStopDot" r="9" opacity="0"></circle><circle id="stopDot" r="8" fill="var(--spiral)" filter="url(#tipGlow)"></circle><g id="wedges"></g><g id="labelPaths"></g><g id="labels"></g></svg>
<dialog id="qcCard" aria-labelledby="qcCardQuestion"><button id="qcCardClose" autofocus>×</button><p id="qcCardName" class="muted"></p><h2 id="qcCardQuestion"></h2><p id="qcCardDescription"></p></dialog>
<p id="plantCaption" class="plant-caption" aria-live="polite"></p></section>
<section class="reflection"><div id="beforeText"><h2 data-text="beforeTitle"></h2><p data-text="beforeBody"></p><p data-text="whatMight"></p><button id="grow" class="primary" data-text="grow"></button></div><div id="afterText" hidden><blockquote><p data-text="scripture"></p><cite data-text="citation"></cite></blockquote><h2 data-text="afterTitle" tabindex="-1" id="afterHeading"></h2><p data-text="afterBody"></p><p class="invitation" data-text="invitation"></p><button id="discover" class="primary" data-text="discover"></button><p id="demo" hidden data-text="demo"></p></div></section>
</main><footer data-text="disclaimer"></footer><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script src="../languages/en.js"></script><script src="../languages/de.js"></script><script src="../languages/nb.js"></script><script src="../languages/th.js"></script><script src="strings.js"></script><script src="model.js"></script><script src="setup.js"></script><script src="geometry.js"></script><script src="playground.js"></script></body></html>
